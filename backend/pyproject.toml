[project]
name = "plants-research-backend"
version = "0.1.0"
description = "FastAPI backend for plant tissue image analysis"
# 3.13 needs numpy>=2 wheels; our stack is still pinned to `numpy>=1.26,<2`
# (safer across the cellpose / torch / transformers matrix), so gate the
# interpreter range accordingly.  Lift this when bumping numpy to 2.x.
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "supabase>=2.9.0",
    "httpx>=0.27.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0,<2.0",
    "scipy>=1.13.0",
    "Pillow>=10.4.0",
    # PR #11: required at runtime for LI-COR gas-exchange .xlsx ingestion.
    # Previously sat in the `dev` extra for the validate_against_xlsx
    # script; upload endpoint also needs it now.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-requests>=2.32.0",
]
# The `ml` extra carries PyTorch + Cellpose so the lightweight checks
# (ruff / mypy / pytest) in CI don't pay the ~1.5 GB install every run.
# The runtime image installs it explicitly via the Dockerfile.
ml = [
    "torch>=2.2,<3",
    "cellpose>=3.1.0,<4",
    "transformers>=4.45,<5",
    "safetensors>=0.4",
    "scikit-fmm>=2024.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# numpy's type stubs declare `np.ndarray` as `ndarray[ShapeT, DType]` —
# annotating every array with full type parameters adds a lot of noise for
# little benefit in numeric code, and shape/dtype are validated at runtime
# anyway.  Relax this one strict flag; keep the rest.
disallow_any_generics = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
