# ==============================================================================
# Main compose — orchestrates our app services and pulls in Supabase via
# `include:`.  Requires Docker Compose v2.20+.
#   docker compose up -d
# ==============================================================================

name: plants-research

include:
  - docker-compose.supabase.yml

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: plants-backend
    restart: unless-stopped
    depends_on:
      supabase-kong:
        condition: service_started
    environment:
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
      BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      PLANTS_SEGFORMER_DIR: ${PLANTS_SEGFORMER_DIR:-/models/segformer}
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - plants-ml-cache:/root/.cellpose
      - plants-hf-cache:/root/.cache/huggingface
      # Fine-tuned SegFormer checkpoints live here (ignored by git).
      # Run the training notebook locally, then drop the HF-format
      # directory into ./models/segformer.
      - ./models:/models:ro
    ports:
      - "8001:8001"
    networks:
      - supabase-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: plants-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/public:/app/public
    ports:
      - "3000:3000"
    networks:
      - supabase-net

volumes:
  plants-ml-cache:
  plants-hf-cache:
